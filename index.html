<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library</title>
</head>
<body>
    <div class="container">
        <div class="container-left">
            <form>
                <button class="new-book-btn">New Book</button>
                <dialog id="my-dialog">
                    <div class="input-box">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="book_title">
                    </div>
                    <div class="input-box">
                        <label for="author">Author</label>
                        <input type="text" id="author" name="book_author">
                    </div>
                    <div class="input-box">
                        <label for="pages">Pages</label>
                        <input type="tel" id="pages" name="book_pages">
                    </div>
                    <div class="input-box">
                        <label for="read">Read</label>
                        <input type="checkbox" id="read" name="book_read">
                    </div>
                    <div class="border"></div>
                    <div class="input-box">
                        <button class="add-book-btn">Add Book</button>
                    </div>
                </dialog>
            </form>
        </div>
        <div class="container-right">
            <table>
                <thead>
                    <tr>
                        <td></td>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Pages</th>
                        <th>Read</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
